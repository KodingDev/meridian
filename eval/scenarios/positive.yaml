# Representative observable triggers for model-owned disciplines only.
- vars:
    prompt: "The dashboard crashes with TypeError: cannot read properties of undefined (reading id). Diagnose the cause and fix it."
  assert:
    - type: skill-used
      value: meridian:debug
  description: "observable runtime failure -> debug"

- vars:
    prompt: "Before implementing this, verify the current Stripe PaymentIntents idempotency behavior against official sources."
  assert:
    - type: skill-used
      value: meridian:research
  description: "unstable external contract -> research"

- vars:
    prompt: "The checked-in config says the limit is 100, but the runtime reports 200. Establish which value actually governs production before changing it."
  assert:
    - type: skill-used
      value: meridian:triangulate
  description: "conflicting load-bearing sources -> triangulate"

- vars:
    prompt: "Here is review feedback: extract the validation helper and change the retry count. Work out which suggestions are technically justified before changing anything."
  assert:
    - type: skill-used
      value: meridian:respond
  description: "technical review suggestions -> respond"

- vars:
    prompt: "Investigate these three independent packages in parallel and report which one introduces the dependency cycle."
  assert:
    - type: skill-used
      value: meridian:delegate
  description: "independent context-heavy investigation -> delegate"

- vars:
    prompt: "Commit the current change."
  assert:
    - type: skill-used
      value: meridian:commit
  description: "explicit commit request -> commit conventions"

- vars:
    prompt: "Write the pull request description for this branch."
  assert:
    - type: skill-used
      value: meridian:commit
  description: "pull request authoring -> commit conventions"
